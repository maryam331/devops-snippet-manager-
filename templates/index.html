<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps Snippet Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container"><span class="navbar-brand">Snippet Manager</span></div>
    </nav>
    <div class="container">
        <div class="card p-4 mb-4 shadow-sm">
            <form action="/add" method="POST">
                <input type="text" name="title" class="form-control mb-2" placeholder="Title" required>
                <textarea name="content" class="form-control mb-2" rows="3" placeholder="Command/Code" required></textarea>
                <button type="submit" class="btn btn-primary w-100">Save Snippet</button>
            </form>
        </div>
        <div class="row">
            {% for s in snippets %}
            <div class="col-md-6 mb-3">
                <div class="card p-3 shadow-sm h-100">
                    <h5>{{ s.title }}</h5>
                    <pre class="bg-dark text-success p-2 rounded"><code>{{ s.content }}</code></pre>
                    <a href="/delete/{{ loop.index0 }}" class="btn btn-outline-danger btn-sm w-25">Delete</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
